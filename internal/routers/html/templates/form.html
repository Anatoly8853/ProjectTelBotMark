{{ template "header.html" .}}
<div class="container-form py-4">
  <h1 class="mb-4">{{if .p.ID}}Редактировать{{else}}Добавить{{end}} товар</h1>

  <form method="POST" enctype="multipart/form-data" action="{{if .p.ID}}/product/update/{{.p.ID}}{{else}}/product/add{{end}}">
    <div class="mb-3 row align-items-center">
      <label class="col-auto col-form-label" for="categoryInput">Категория:</label>
      <div class="col">
        <input type="text" id="categoryInput" name="category" list="categoryOptions" class="form-control" required autocomplete="off" value="{{.p.Category}}">
        <datalist id="categoryOptions"></datalist>
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label class="col-auto col-form-label" for="titleInput">Название:</label>
      <div class="col">
        <input type="text" id="titleInput" name="title" list="titleOptions" class="form-control" required autocomplete="off" value="{{.p.Title}}">
        <datalist id="titleOptions"></datalist>
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label class="col-auto col-form-label">Описание:</label>
      <div class="col">
        <textarea name="description" class="form-control" required>{{.p.Description}}</textarea>
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label class="col-auto col-form-label" for="packagingInput">Фасовка:</label>
      <div class="col">
        <input type="text" id="packagingInput" name="packaging" list="packagingOptions" class="form-control" required autocomplete="off" value="{{.p.Packaging}}">
        <datalist id="packagingOptions"></datalist>
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <label class="col-auto col-form-label">Цена:</label>
      <div class="col">
        <input type="number" step="1" name="price" class="form-control" value="{{.p.Price}}">
      </div>
    </div>

    <div class="mb-3 row align-items-center">
      <div class="mb-3">
        <label for="imageUpload" class="form-label">Фото:</label>
        <div class="d-flex align-items-center gap-2">
          <input class="form-control d-none" type="file" id="imageUpload" name="image">
          <label for="imageUpload" class="btn btn-outline-secondary mb-0 ">Выбрать файл</label>
          <span id="file-name" class="form-control text-muted">Файл не выбран</span>
        </div>

        {{if .p.Image}}
        <input type="hidden" name="existing_image" value="{{.p.Image}}">
        <div class="mt-2">
          <p class="mb-1 text-muted">Текущее изображение:</p>
          <img src="/{{.p.Image}}" alt="Превью" class="img-thumbnail" style="max-height: 200px;">
        </div>
        {{end}}
      </div>

      <div class="row">
        <div class="col">
          <button class="btn btn-primary">{{if .p.ID}}💾 Сохранить{{else}}➕ Добавить{{end}}</button>
          <a href="/product" class="btn btn-secondary ms-2">Назад</a>
        </div>
      </div>
    </div>
  </form>
</div>

<select id="productOptionSource" class="d-none" aria-hidden="true">
  {{range .Options}}
  <option data-category="{{.Category}}" data-title="{{.Title}}" data-packaging="{{.Packaging}}"></option>
  {{end}}
</select>

<script>
  const input = document.getElementById('imageUpload');
  const fileNameSpan = document.getElementById('file-name');

  input.addEventListener('change', function () {
    fileNameSpan.textContent = this.files.length > 0 ? this.files[0].name : 'Файл не выбран';
  });

  // Варианты загружаются из БД. Новые значения можно вводить вручную.
  const productOptions = Array.from(document.getElementById('productOptionSource').options).map(option => ({
    Category: option.dataset.category,
    Title: option.dataset.title,
    Packaging: option.dataset.packaging
  }));
  const categoryInput = document.getElementById('categoryInput');
  const titleInput = document.getElementById('titleInput');
  const packagingInput = document.getElementById('packagingInput');
  const categoryOptions = document.getElementById('categoryOptions');
  const titleOptions = document.getElementById('titleOptions');
  const packagingOptions = document.getElementById('packagingOptions');

  function fillDatalist(list, values) {
    list.replaceChildren();
    [...new Set(values.filter(Boolean))].forEach(value => {
      const option = document.createElement('option');
      option.value = value;
      list.appendChild(option);
    });
  }

  function updateTitleOptions() {
    const category = categoryInput.value.trim();
    const titles = productOptions
      .filter(option => option.Category === category)
      .map(option => option.Title);
    fillDatalist(titleOptions, titles);
  }

  function updatePackagingOptions() {
    const category = categoryInput.value.trim();
    const title = titleInput.value.trim();
    const packagings = productOptions
      .filter(option => option.Category === category && option.Title === title)
      .map(option => option.Packaging);
    fillDatalist(packagingOptions, packagings);
  }

  fillDatalist(categoryOptions, productOptions.map(option => option.Category));
  updateTitleOptions();
  updatePackagingOptions();

  categoryInput.addEventListener('change', function () {
    titleInput.value = '';
    packagingInput.value = '';
    updateTitleOptions();
    updatePackagingOptions();
  });

  titleInput.addEventListener('change', function () {
    packagingInput.value = '';
    updatePackagingOptions();
  });
</script>
{{ template "footer.html" .}}
