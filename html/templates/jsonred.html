<!--index.html-->
<!--Embed the header.html template at this location-->
{{ template "header.html" .}}
<style>
    .edit-button {
        background-color: #28a745;
    }
    .edit-button:hover {
        background-color: #218838;
    }
    .edit-interface {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 10px;
        right: -261px;
    }
    .edit-interface input {
        padding: 5px;
        font-size: 16px;
    }
</style>
<div class="container-poisc">
    <div class="containerjson">
        <div class="photo" id="photo"></div>
        <div id="photo-button"></div>
        <div id="menu"></div>
        <div id="edit-interface" class="edit-interface"></div>
    </div>
</div>
<script>
    const data = JSON.parse('{{ .categories | toJSON }}');
    const menu = document.getElementById('menu');
    const photo = document.getElementById('photo');
    const photoButton = document.getElementById('photo-button');
    const editInterface = document.getElementById('edit-interface');

    function separateEmojiAndText(text) {
        const emojiPattern = /[\p{Emoji_Presentation}\uFE0F]/gu;
        const emojis = text.match(emojiPattern) || [];
        const cleanText = text.replace(emojiPattern, '').trim().replace(/\s+/g, ' ');
        return { emojis: emojis.join(''), cleanText: cleanText };
    }

    function createCategory(category, clearPhoto = true) {
        if (clearPhoto) {
            photo.innerHTML = '';
            photoButton.innerHTML = '';
        }
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'category';
        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'buttons';

        category.buttons.forEach(button => {
            const btn = document.createElement('button');
            btn.className = 'button';
            btn.innerText = button.text;
            btn.onclick = () => navigate(separateEmojiAndText(button.text).cleanText);
            buttonsDiv.appendChild(btn);
        });

        categoryDiv.appendChild(buttonsDiv);

        if (category.buttonsM) {
            const backButtonDiv = document.createElement('div');
            backButtonDiv.className = 'buttons';

            category.buttonsM.forEach(button => {
                const btn = document.createElement('button');
                btn.className = 'button back-button';
                btn.innerText = button.text;
                btn.onclick = () => {
                    if (button.text === '🔙Назад🔙') {
                        navigate('Меню');
                    } else {
                        navigate(separateEmojiAndText(button.text).cleanText);
                    }
                };
                backButtonDiv.appendChild(btn);
            });

            categoryDiv.appendChild(backButtonDiv);
        }

        const editBtn = document.createElement('button');
        editBtn.className = 'button edit-button';
        editBtn.innerText = 'Редактировать';
        editBtn.onclick = () => showEditInterface(category);
        categoryDiv.appendChild(editBtn);

        menu.appendChild(categoryDiv);
    }

    function createSubcategory(category) {
        photo.innerHTML = '';
        photoButton.innerHTML = '';

        if (category.photo) {
            const img = document.createElement('img');
            img.src = category.photo;
            photo.appendChild(img);
        }

        const buttonsDiv = document.createElement('div');
        buttonsDiv.className = 'buttons';

        category.buttons.forEach(button => {
            const btn = document.createElement('button');
            btn.className = 'button';
            btn.innerText = button.text;
            buttonsDiv.appendChild(btn);
        });

        photoButton.appendChild(buttonsDiv);
    }

    function navigate(categoryName) {
        const cleanCategoryName = separateEmojiAndText(categoryName).cleanText;
        let foundCategory = null;

        Object.keys(data).forEach(key => {
            if (separateEmojiAndText(key).cleanText === cleanCategoryName) {
                foundCategory = data[key];
            }
        });

        if (foundCategory) {
            if (foundCategory.photo) {
                createSubcategory(foundCategory);
            } else {
                menu.innerHTML = '';
                createCategory(foundCategory);
            }
        } else {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error';
            errorDiv.innerText = `Category "${categoryName}" not found.`;
            menu.appendChild(errorDiv);
        }
    }

    function showEditInterface(category) {
        editInterface.innerHTML = '';
        const title = document.createElement('h3');
        title.innerText = `Редактирование: ${category.categoryName}`;
        editInterface.appendChild(title);

        category.buttons.forEach((button, index) => {
            const input = document.createElement('input');
            input.type = 'text';
            input.value = button.text;
            input.oninput = (e) => {
                category.buttons[index].text = e.target.value;
            };
            editInterface.appendChild(input);
        });

        const saveBtn = document.createElement('button');
        saveBtn.className = 'button edit-button';
        saveBtn.innerText = 'Сохранить';
        saveBtn.onclick = () => saveChanges();
        editInterface.appendChild(saveBtn);
    }

    function saveChanges() {
        const updatedData = JSON.stringify(data);
        fetch('/jsonred/save', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: updatedData,
        }).then(response => {
            if (response.ok) {
                alert('Изменения сохранены!');
                editInterface.innerHTML = '';
                navigate('Старт');
            } else {
                alert('Ошибка при сохранении.');
            }
        });
    }

    createCategory(data["Старт"]);
</script>
{{ template "footer.html" .}}
