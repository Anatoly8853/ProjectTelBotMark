<!--index.html-->
<!--Embed the header.html template at this location-->
{{ template "header.html" .}}

<div class="container">
    <div class="card_black">
        <h4 class="card-title">Люди от которых мы не хоти принимать заказы</h4>
        <!--If there's an error, display the error-->
        <p class="centersH">{{.Message}}</p>
        {{ if not .Message }}
<form method="POST" action="/black/update">
    <table class="center">
        <tr>
            <th>ID Пользователя</th>
            <th>Имя Пользователя</th>
            <th>Вкл/Откл Black</th>
            <th>Активировать</th>
        </tr>
        {{ range .Users }}
        <tr>
            <td>{{ .UserID }}</td>
            <td>{{ .UserBlack.UserName }}</td>
            <td>
                <input type="checkbox" name="user_black_{{ .UserID }}" value="1" {{ if eq .UserBlack.UserBlack 1 }}checked{{ end }}>
            </td>
            <td>
                <button type="submit" class="btn btn-primary" name="user_id" value="{{ .UserID }}">Сохранить</button>
            </td>
        </tr>
        {{ end }}
        {{ end }}
    </table>
</form>
    </div>
</div>

<!--Embed the footer.html template at this location-->
{{ template "footer.html" .}}
