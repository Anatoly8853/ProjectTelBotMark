<!--upload.html-->
<!--Embed the header.html template at this location-->
{{ template "header.html" .}}
<div class="container">
    <div class="card">
        <h2 class="card-title">Извещение пользователей</h2>
        <!--If there's an error, display the error-->
        {{ if .Message}}
        <h4><p class="centersH">{{.Message}}</p></h4>
        {{end}}
        <form class="registration-form" action="/info" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="Info">Тип информации</label>
                <input type="text" id="Info" name="Info" placeholder="Объявление, Инфо">
            </div>
            <div class="form-group">
                <label for="InfoText">Сообщение для отправки</label>
                <input type="text" id="InfoText" name="InfoText" placeholder="Текст сообщения">
            </div>
            <div class="form-group">
                <label for="Image">Изображение</label>
                <input type="file" id="Image" name="Image">
            </div>
            <button type="submit" class="btn">Отправить</button>
        </form>
    </div>
</div>
<!--Embed the footer.html template at this location-->
{{ template "footer.html" .}}
